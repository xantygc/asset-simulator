<!DOCTYPE html>
<html>
<head>
    <title>WebSocket Debug</title>
    <style>
        body { font-family: monospace; padding: 20px; background: #1a1a1a; color: #0f0; }
        .log { background: #000; padding: 10px; margin: 10px 0; border: 1px solid #0f0; max-height: 400px; overflow-y: auto; }
        .status { font-size: 1.2rem; margin: 10px 0; }
        .connected { color: #0f0; }
        .disconnected { color: #f00; }
    </style>
</head>
<body>
    <h1>WebSocket Debug Monitor</h1>
    <div class="status" id="status">Connecting...</div>
    <h2>Last Message:</h2>
    <div class="log" id="lastMsg">Waiting for data...</div>
    <h2>All Messages:</h2>
    <div class="log" id="allMsg"></div>

    <script>
        let ws = null;
        let msgCount = 0;

        function connect() {
            document.getElementById('status').textContent = 'Connecting to ws://localhost:8001/ws...';
            document.getElementById('status').className = 'status disconnected';

            ws = new WebSocket('ws://localhost:8001/ws');

            ws.onopen = () => {
                document.getElementById('status').textContent = '✓ Connected';
                document.getElementById('status').className = 'status connected';
            };

            ws.onmessage = (event) => {
                msgCount++;
                const data = JSON.parse(event.data);

                // Show last message formatted
                const formatted = JSON.stringify(data, null, 2);
                document.getElementById('lastMsg').innerHTML = `<pre>${formatted}</pre>`;

                // Log summary
                const summary = `[${msgCount}] ${new Date().toLocaleTimeString()} - Keys: ${Object.keys(data).join(', ')}`;
                const allMsg = document.getElementById('allMsg');
                const entry = document.createElement('div');
                entry.textContent = summary;
                allMsg.insertBefore(entry, allMsg.firstChild);

                // Keep last 20
                while (allMsg.children.length > 20) {
                    allMsg.removeChild(allMsg.lastChild);
                }
            };

            ws.onerror = (error) => {
                document.getElementById('status').textContent = '✗ Error: ' + error;
                document.getElementById('status').className = 'status disconnected';
            };

            ws.onclose = () => {
                document.getElementById('status').textContent = '✗ Disconnected - Reconnecting in 3s...';
                document.getElementById('status').className = 'status disconnected';
                setTimeout(connect, 3000);
            };
        }

        connect();
    </script>
</body>
</html>
